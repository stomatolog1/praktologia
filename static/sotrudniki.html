<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktologia — Реестр сотрудников</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Реестр сотрудников</h1>
            <p>Общий реестр — доступен всем пользователям</p>
        </header>
        <div class="page-body">
            <div class="nav-bar">
                <a href="/" class="nav-link nav-link-back">← Главная</a>
            </div>

            <div class="section-header">
                <h2>Сотрудники</h2>
                <a href="/static/sotrudnik-create.html" class="btn">+ Создать сотрудника</a>
            </div>

            <div id="list" class="list">
                <div class="empty-state"><p>Загрузка...</p></div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        async function deleteSotrudnik(id, name) {
            if (!confirm(`Вы уверены, что хотите удалить сотрудника "${name}"?`)) return;
            try {
                await API.delete(`Sotrudnik/${id}`);
                loadSotrudniki(); // Reload the list
            } catch (error) {
                alert('Ошибка удаления: ' + error.message);
            }
        }

        async function loadSotrudniki() {
            try {
                const items = await API.get('Sotrudnik');

                if (!items.length) {
                    renderEmptyList('list', 'Сотрудники ещё не добавлены.');
                    return;
                }

                document.getElementById('list').innerHTML = items.map(s => `
                    <div class="list-item">
                        <div class="list-item-link">
                            <div class="list-item-title">${formatFio(s)}</div>
                            <div class="list-item-meta">
                                ${s.Position} · ${formatMoney(s.PayMount)}/мес · налог ${s.Tax}%
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn btn-sm btn-danger" onclick="deleteSotrudnik(${s.id}, '${formatFio(s)}')">Удалить</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                renderEmptyList('list', 'Ошибка загрузки: ' + error.message);
            }
        }

        loadSotrudniki();
    </script>
</body>
</html>
