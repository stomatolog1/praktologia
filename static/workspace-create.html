<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktologia — Создание рабочей области</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Создание рабочей области</h1>
            <p>Укажите название и описание для новой рабочей области</p>
        </header>
        <div class="page-body">
            <div class="nav-bar">
                <a href="/static/workspace.html" class="nav-link nav-link-back">← К списку областей</a>
            </div>

            <div class="card">
                <div id="alert" class="alert"></div>
                <form id="create-form">
                    <div class="form-group">
                        <label>Название рабочей области</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="description"></textarea>
                    </div>

                    <button type="submit" class="btn btn-block">Создать рабочую область</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        const user = Auth.requireAuth();
        if (!user) throw new Error('auth required');

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                await API.post('WorkSpace', {
                    admin_id: user.id,
                    name: document.getElementById('name').value,
                    description: document.getElementById('description').value,
                    totalCost: 0,
                    resources: []
                });
                showAlert('alert', 'Рабочая область создана', 'success');
                setTimeout(() => {
                    window.location.href = '/static/workspace.html';
                }, 800);
            } catch (error) {
                showAlert('alert', error.message, 'error');
            }
        });
    </script>
</body>
</html>
