<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktologia — Документы</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Документы</h1>
            <p>Создание НМА и Коммерческого предложения на основе проекта</p>
        </header>
        <div class="page-body">
            <div class="nav-bar">
                <a href="/" class="nav-link nav-link-back">← Главная</a>
            </div>
            <div class="form-container">
                <div class="form-group">
                    <label for="project-select">Выберите проект</label>
                    <select id="project-select"><option value="">Загрузка проектов...</option></select>
                </div>
                <div class="form-group">
                    <label for="customer-select">Выберите заказчика</label>
                    <select id="customer-select"><option value="">Загрузка заказчиков...</option></select>
                </div>
                <button type="button" class="btn" id="generate-docs">Сформировать</button>
            </div>
            <div id="documents-output" class="documents-output-container">
                <div id="nma-output"></div>
                <div id="commercial-offer-output"></div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const projectSelect = document.getElementById('project-select');
            const customerSelect = document.getElementById('customer-select');
            const generateBtn = document.getElementById('generate-docs');
            const nmaOutput = document.getElementById('nma-output');
            const commercialOfferOutput = document.getElementById('commercial-offer-output');

            // Fetch projects
            fetch('/projects')
                .then(response => response.json())
                .then(projects => {
                    projectSelect.innerHTML = '<option value="">-- Выберите проект --</option>';
                    (projects || []).forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.id;
                        option.textContent = project.Name;
                        projectSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error fetching projects:', error);
                    projectSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                });

            // Fetch customers
            fetch('/customers')
                .then(response => response.json())
                .then(customers => {
                    customerSelect.innerHTML = '<option value="">-- Выберите заказчика --</option>';
                    (customers || []).forEach(customer => {
                        const option = document.createElement('option');
                        option.value = customer.id;
                        option.textContent = customer.Name + customer.Firm ;
                        customerSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error fetching customers:', error);
                    customerSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
                });

            generateBtn.addEventListener('click', () => {
                const projectId = projectSelect.value;
                const customerId = customerSelect.value;

                nmaOutput.innerHTML = '';
                commercialOfferOutput.innerHTML = '';

                if (!projectId) {
                    alert('Пожалуйста, выберите проект.');
                    return;
                }

                // Generate NMA
                nmaOutput.innerHTML = '<h2>Генерация НМА...</h2>';
                fetch(`/nma/${projectId}`)
                    .then(response => response.json())
                    .then(nma => {
                        if (nma.error) {
                            throw new Error(nma.error);
                        }
                        let resourcesHtml = (nma.resources || []).map(r => `<li>${r.name} (${r.costType}): ${r.cost}</li>`).join('');
                        
                    })
                    .catch(error => {
                        console.error('Error fetching NMA:', error);
                        nmaOutput.innerHTML = '<h2>Ошибка при генерации НМА</h2><p>' + error.message + '</p>';
                    });

                if (!customerId) {
                    // Don't generate commercial offer if no customer is selected
                    return;
                }
                
                // Generate Commercial Offer
                commercialOfferOutput.innerHTML = '<h2>Генерация КП...</h2>';
                fetch(`/commercial-offer/${projectId}/${customerId}`)
                    .then(response => response.json())
                    .then(offer => {
                        if (offer.error) {
                            throw new Error(offer.error);
                        }
                        let servicesHtml = (offer.services || []).map(s => `<tr><td>${s.name}</td><td>${s.hours}</td><td>${s.interval}</td><td>${s.cost}</td></tr>`).join('');
                    })
                    .catch(error => {
                        console.error('Error fetching Commercial Offer:', error);
                        commercialOfferOutput.innerHTML = '<h2>Ошибка при генерации КП</h2><p>' + error.message + '</p>';
                    });
            });
        });
    </script>
</body>
</html>
