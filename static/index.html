<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktologia - Управление проектами</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #eee;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid #28a745;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item strong {
            color: #667eea;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #e9ecef;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
        }

        .empty-state p {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Praktologia</h1>
            <p>Система управления проектами и ресурсами</p>
        </header>

        <div class="content">
            <!-- Левая колонка - Формы -->
            <div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab(event, 'equipment')">Оборудование</button>
                    <button class="tab-btn" onclick="switchTab(event, 'executor')">Исполнитель</button>
                    <button class="tab-btn" onclick="switchTab(event, 'sotrudnik')">Сотрудник</button>
                    <button class="tab-btn" onclick="switchTab(event, 'customer')">Клиент</button>
                </div>

                <!-- Форма Оборудования -->
                <div id="equipment" class="tab-content active">
                    <div class="card">
                        <h2>➕ Добавить оборудование</h2>
                        <div id="equipment-alert" class="alert"></div>
                        <form onsubmit="createEquipment(event)">
                            <div class="form-group">
                                <label>Название</label>
                                <input type="text" id="equip-name" placeholder="Сверлильный станок" required>
                            </div>
                            <div class="form-group">
                                <label>Описание</label>
                                <textarea id="equip-desc" placeholder="Описание оборудования" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Тип</label>
                                <input type="text" id="equip-type" placeholder="Станок" required>
                            </div>
                            <div class="form-group">
                                <label>Стоимость аренды</label>
                                <input type="number" id="equip-rental" placeholder="5000" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Период</label>
                                <input type="text" id="equip-period" placeholder="день/месяц" required>
                            </div>
                            <div class="form-group">
                                <label>Стоимость</label>
                                <input type="number" id="equip-cost" placeholder="50000" step="0.01" required>
                            </div>
                            <button type="submit">Добавить оборудование</button>
                        </form>
                    </div>
                </div>

                <!-- Форма Исполнителя -->
                <div id="executor" class="tab-content">
                    <div class="card">
                        <h2>➕ Добавить исполнителя</h2>
                        <div id="executor-alert" class="alert"></div>
                        <form onsubmit="createExecutor(event)">
                            <div class="form-group">
                                <label>Имя</label>
                                <input type="text" id="exec-name" placeholder="Иван" required>
                            </div>
                            <div class="form-group">
                                <label>Отчество</label>
                                <input type="text" id="exec-second" placeholder="Иванович" required>
                            </div>
                            <div class="form-group">
                                <label>Фамилия</label>
                                <input type="text" id="exec-surname" placeholder="Иванов">
                            </div>
                            <div class="form-group">
                                <label>Тип работ</label>
                                <input type="text" id="exec-type" placeholder="Сварка" required>
                            </div>
                            <div class="form-group">
                                <label>Налог (%)</label>
                                <input type="number" id="exec-tax" placeholder="13" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Период оплаты</label>
                                <input type="text" id="exec-period" placeholder="месяц" required>
                            </div>
                            <div class="form-group">
                                <label>Стоимость</label>
                                <input type="number" id="exec-cost" placeholder="50000" step="0.01" required>
                            </div>
                            <button type="submit">Добавить исполнителя</button>
                        </form>
                    </div>
                </div>

                <!-- Форма Сотрудника -->
                <div id="sotrudnik" class="tab-content">
                    <div class="card">
                        <h2>➕ Добавить сотрудника</h2>
                        <div id="sotrudnik-alert" class="alert"></div>
                        <form onsubmit="createSotrudnik(event)">
                            <div class="form-group">
                                <label>Имя</label>
                                <input type="text" id="sotr-name" placeholder="Петр" required>
                            </div>
                            <div class="form-group">
                                <label>Отчество</label>
                                <input type="text" id="sotr-second" placeholder="Петрович" required>
                            </div>
                            <div class="form-group">
                                <label>Фамилия</label>
                                <input type="text" id="sotr-surname" placeholder="Петров" required>
                            </div>
                            <div class="form-group">
                                <label>Должность</label>
                                <input type="text" id="sotr-position" placeholder="Инженер" required>
                            </div>
                            <div class="form-group">
                                <label>Зарплата</label>
                                <input type="number" id="sotr-salary" placeholder="60000" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Налог (%)</label>
                                <input type="number" id="sotr-tax" placeholder="13" step="0.01" required>
                            </div>
                            <button type="submit">Добавить сотрудника</button>
                        </form>
                    </div>
                </div>

                <!-- Форма Клиента -->
                <div id="customer" class="tab-content">
                    <div class="card">
                        <h2>➕ Добавить клиента</h2>
                        <div id="customer-alert" class="alert"></div>
                        <form onsubmit="createCustomer(event)">
                            <div class="form-group">
                                <label>ИНН</label>
                                <input type="number" id="cust-inn" placeholder="7712345678" required>
                            </div>
                            <div class="form-group">
                                <label>Тип клиента</label>
                                <input type="text" id="cust-type" placeholder="ООО" required>
                            </div>
                            <div class="form-group">
                                <label>Организация</label>
                                <input type="text" id="cust-firm" placeholder="ООО Компания" required>
                            </div>
                            <div class="form-group">
                                <label>Имя контактного лица</label>
                                <input type="text" id="cust-name" placeholder="Александр" required>
                            </div>
                            <div class="form-group">
                                <label>Отчество</label>
                                <input type="text" id="cust-second" placeholder="Сергеевич" required>
                            </div>
                            <div class="form-group">
                                <label>Фамилия</label>
                                <input type="text" id="cust-surname" placeholder="Сергеев" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="cust-email" placeholder="alex@company.com" required>
                            </div>
                            <div class="form-group">
                                <label>Телефон</label>
                                <input type="tel" id="cust-phone" placeholder="79991234567" required>
                            </div>
                            <button type="submit">Добавить клиента</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Правая колонка - Результаты -->
            <div>
                <div class="card">
                    <h2>📋 История создания</h2>
                    <div id="results" class="results">
                        <div class="empty-state">
                            <p>Здесь будут отображаться созданные элементы...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let createdItems = [];

        function switchTab(event, tabName) {
            // Скрыть все табы
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });

            // Показать нужный таб
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(elementId, message, type) {
            const alert = document.getElementById(elementId);
            alert.textContent = message;
            alert.className = 'alert ' + type;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 3000);
        }

        function updateResults() {
            const resultsDiv = document.getElementById('results');
            if (createdItems.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <p>Здесь будут отображаться созданные элементы...</p>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = createdItems.map((item, index) => `
                <div class="result-item">
                    <strong>ID: ${item.id}</strong><br>
                    <small>${item.type}</small><br>
                    ${Object.entries(item.data).map(([key, value]) =>
                        `<div><small>${key}: ${value}</small></div>`
                    ).join('')}
                </div>
            `).join('');
        }

        async function createEquipment(e) {
            e.preventDefault();
            try {
                const response = await fetch('/api/Equipment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Name: document.getElementById('equip-name').value,
                        Description: document.getElementById('equip-desc').value,
                        TypeOperating: document.getElementById('equip-type').value,
                        RentaCost: parseFloat(document.getElementById('equip-rental').value),
                        PayTime: document.getElementById('equip-period').value,
                        Cost: parseFloat(document.getElementById('equip-cost').value)
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    createdItems.unshift({
                        id: data.id,
                        type: '🔧 Оборудование',
                        data: data
                    });
                    updateResults();
                    e.target.reset();
                    showAlert('equipment-alert', '✅ Оборудование успешно добавлено!', 'success');
                } else {
                    showAlert('equipment-alert', '❌ Ошибка при добавлении', 'error');
                }
            } catch (error) {
                showAlert('equipment-alert', '❌ Ошибка подключения: ' + error.message, 'error');
            }
        }

        async function createExecutor(e) {
            e.preventDefault();
            try {
                const response = await fetch('/api/Executor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Name: document.getElementById('exec-name').value,
                        SecondName: document.getElementById('exec-second').value,
                        Surname: document.getElementById('exec-surname').value,
                        TypeDesign: document.getElementById('exec-type').value,
                        Tax: parseFloat(document.getElementById('exec-tax').value),
                        payTime: document.getElementById('exec-period').value,
                        Cost: parseFloat(document.getElementById('exec-cost').value)
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    createdItems.unshift({
                        id: data.id,
                        type: '👷 Исполнитель',
                        data: data
                    });
                    updateResults();
                    e.target.reset();
                    showAlert('executor-alert', '✅ Исполнитель успешно добавлен!', 'success');
                } else {
                    showAlert('executor-alert', '❌ Ошибка при добавлении', 'error');
                }
            } catch (error) {
                showAlert('executor-alert', '❌ Ошибка подключения: ' + error.message, 'error');
            }
        }

        async function createSotrudnik(e) {
            e.preventDefault();
            try {
                const response = await fetch('/api/Sotrudnik', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Name: document.getElementById('sotr-name').value,
                        SecondName: document.getElementById('sotr-second').value,
                        Surname: document.getElementById('sotr-surname').value,
                        Position: document.getElementById('sotr-position').value,
                        PayMount: parseFloat(document.getElementById('sotr-salary').value),
                        Tax: parseFloat(document.getElementById('sotr-tax').value)
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    createdItems.unshift({
                        id: data.id,
                        type: '👔 Сотрудник',
                        data: data
                    });
                    updateResults();
                    e.target.reset();
                    showAlert('sotrudnik-alert', '✅ Сотрудник успешно добавлен!', 'success');
                } else {
                    showAlert('sotrudnik-alert', '❌ Ошибка при добавлении', 'error');
                }
            } catch (error) {
                showAlert('sotrudnik-alert', '❌ Ошибка подключения: ' + error.message, 'error');
            }
        }

        async function createCustomer(e) {
            e.preventDefault();
            try {
                const response = await fetch('/api/Customer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        InnCustomer: parseInt(document.getElementById('cust-inn').value),
                        TypeCustomer: document.getElementById('cust-type').value,
                        Firm: document.getElementById('cust-firm').value,
                        Name: document.getElementById('cust-name').value,
                        SecondName: document.getElementById('cust-second').value,
                        Surname: document.getElementById('cust-surname').value,
                        Email: document.getElementById('cust-email').value,
                        Phone: parseInt(document.getElementById('cust-phone').value)
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    createdItems.unshift({
                        id: data.id,
                        type: '👤 Клиент',
                        data: data
                    });
                    updateResults();
                    e.target.reset();
                    showAlert('customer-alert', '✅ Клиент успешно добавлен!', 'success');
                } else {
                    showAlert('customer-alert', '❌ Ошибка при добавлении', 'error');
                }
            } catch (error) {
                showAlert('customer-alert', '❌ Ошибка подключения: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
