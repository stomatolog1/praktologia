<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktologia — Реестр оборудования</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Реестр оборудования</h1>
            <p>Учёт оборудования и стоимости использования</p>
        </header>
        <div class="page-body">
            <div class="nav-bar">
                <a href="/" class="nav-link nav-link-back">← Главная</a>
            </div>

            <div class="section-header">
                <h2>Оборудование</h2>
                <a href="/static/equipment-create.html" class="btn">+ Создать оборудование</a>
            </div>

            <div id="list" class="list">
                <div class="empty-state"><p>Загрузка...</p></div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        async function loadEquipment() {
            try {
                const items = await API.get('Equipment');

                if (!items.length) {
                    renderEmptyList('list', 'Оборудование ещё не добавлено. Нажмите «Создать оборудование».');
                    return;
                }

                document.getElementById('list').innerHTML = items.map(e => `
                    <div class="list-item">
                        <div class="list-item-link">
                            <div class="list-item-title">${e.Name}</div>
                            <div class="list-item-meta">
                                ${e.TypeOperating} · ${e.PayTime} · ${e.Cost} ₽
                            </div>
                            <div class="list-item-meta">${e.Description || ''}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                renderEmptyList('list', 'Ошибка загрузки: ' + error.message);
            }
        }

        loadEquipment();
    </script>
</body>
</html>
